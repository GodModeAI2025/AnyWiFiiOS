name: CaptiveAI
options:
  bundleIdPrefix: de.mobilebox
  deploymentTarget:
    iOS: "27.0"
  developmentLanguage: de
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: SP73Z8JWXM
packages:
  CaptiveCore:
    path: Packages/CaptiveCore
targetTemplates:
  AppBase:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: CaptiveCore
        product: CaptiveCore
      - package: CaptiveCore
        product: CaptiveCoreApple
      - target: CaptiveAIControls
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: CaptiveAI
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CaptiveKeychainGroup: "$(AppIdentifierPrefix)de.mobilebox.captiveai.shared"
        # Captive Portals sprechen vor der Anmeldung nur HTTP. Ohne Ausnahme könnte die App sie nicht bedienen.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSMicrophoneUsageDescription: "Für die Spracheingabe, wenn du die Anmeldung per Sprache beschreibst. Audio wird nur auf dem Gerät verarbeitet."
        NSSpeechRecognitionUsageDescription: "Für die Spracheingabe. Die Erkennung läuft auf dem Gerät."
        CFBundleDocumentTypes:
          - CFBundleTypeName: CaptiveAI Recipe
            LSHandlerRank: Alternate
            CFBundleTypeRole: Viewer
            LSItemContentTypes:
              - public.yaml
          - CFBundleTypeName: CaptiveAI Profil
            LSHandlerRank: Owner
            CFBundleTypeRole: Editor
            LSItemContentTypes:
              - de.mobilebox.captiveai.profile
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: de.mobilebox.captiveai.profile
            UTTypeDescription: CaptiveAI Profil
            UTTypeConformsTo:
              - public.data
              - public.content
            UTTypeTagSpecification:
              public.filename-extension:
                - captiveprofile
              public.mime-type:
                - application/x-captiveprofile
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/CaptiveAI.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.mobilebox.captiveai
        CODE_SIGN_ENTITLEMENTS: App/CaptiveAI.entitlements
        GENERATE_INFOPLIST_FILE: NO

targets:
  CaptiveAIApp:
    templates: [AppBase]
    # Gerätebuild: mit Hotspot-Providern (brauchen Entitlements im Provisioning Profile).
    dependencies:
      - target: HotspotEvaluationProvider
      - target: HotspotAuthenticationProvider
  CaptiveAIAppDev:
    templates: [AppBase]
    # Simulator und CI: ohne Provider, der Simulator lehnt deren Extension-Points ab (ADR 0005).
    settings:
      base:
        PRODUCT_NAME: CaptiveAIApp
  CaptiveAIControls:
    type: app-extension
    platform: iOS
    sources:
      - path: Controls
      - path: App/Shared
    dependencies:
      - package: CaptiveCore
        product: CaptiveCore
      - package: CaptiveCore
        product: CaptiveCoreApple
    info:
      path: Controls/Info.plist
      properties:
        CFBundleDisplayName: CaptiveAI Steuerelemente
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CaptiveKeychainGroup: "$(AppIdentifierPrefix)de.mobilebox.captiveai.shared"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Controls/CaptiveAIControls.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.mobilebox.captiveai
        keychain-access-groups:
          - $(AppIdentifierPrefix)de.mobilebox.captiveai.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.mobilebox.captiveai.controls
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  HotspotEvaluationProvider:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/HotspotEvaluationProvider
      - path: App/Shared
    dependencies:
      - package: CaptiveCore
        product: CaptiveCore
      - package: CaptiveCore
        product: CaptiveCoreApple
    info:
      path: Extensions/HotspotEvaluationProvider/Info.plist
      properties:
        CFBundleDisplayName: CaptiveAI Evaluation
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CaptiveKeychainGroup: "$(AppIdentifierPrefix)de.mobilebox.captiveai.shared"
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.networkextension.hotspot-evaluation
    entitlements:
      path: Extensions/HotspotEvaluationProvider/HotspotEvaluationProvider.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - hotspot-provider
        com.apple.security.application-groups:
          - group.de.mobilebox.captiveai
        keychain-access-groups:
          - $(AppIdentifierPrefix)de.mobilebox.captiveai.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.mobilebox.captiveai.evaluation
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  HotspotAuthenticationProvider:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/HotspotAuthenticationProvider
      - path: App/Shared
    dependencies:
      - package: CaptiveCore
        product: CaptiveCore
      - package: CaptiveCore
        product: CaptiveCoreApple
    info:
      path: Extensions/HotspotAuthenticationProvider/Info.plist
      properties:
        CFBundleDisplayName: CaptiveAI Anmeldung
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CaptiveKeychainGroup: "$(AppIdentifierPrefix)de.mobilebox.captiveai.shared"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.networkextension.hotspot-authentication
    entitlements:
      path: Extensions/HotspotAuthenticationProvider/HotspotAuthenticationProvider.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - hotspot-provider
        com.apple.security.application-groups:
          - group.de.mobilebox.captiveai
        keychain-access-groups:
          - $(AppIdentifierPrefix)de.mobilebox.captiveai.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.mobilebox.captiveai.authentication
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  CaptiveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: CaptiveAIAppDev
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.mobilebox.captiveai.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CaptiveAI:
    build:
      targets:
        CaptiveAIAppDev: all
    test:
      targets:
        - CaptiveUITests
  CaptiveAI-Device:
    build:
      targets:
        CaptiveAIApp: all
