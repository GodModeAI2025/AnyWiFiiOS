name: CaptiveAI
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "27.0"
  developmentLanguage: de
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  CaptiveCore:
    path: Packages/CaptiveCore
targets:
  CaptiveAIApp:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: CaptiveCore
        product: CaptiveCore
      - package: CaptiveCore
        product: CaptiveCoreApple
      - target: CaptiveAIControls
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: CaptiveAI
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CaptiveKeychainGroup: "$(AppIdentifierPrefix)com.example.captiveai.shared"
        # Captive Portals sprechen vor der Anmeldung nur HTTP. Ohne Ausnahme könnte die App sie nicht bedienen.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/CaptiveAI.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.captiveai
        CODE_SIGN_ENTITLEMENTS: App/CaptiveAI.entitlements
        GENERATE_INFOPLIST_FILE: NO
  CaptiveAIControls:
    type: app-extension
    platform: iOS
    sources:
      - path: Controls
      - path: App/Shared
    dependencies:
      - package: CaptiveCore
        product: CaptiveCore
      - package: CaptiveCore
        product: CaptiveCoreApple
    info:
      path: Controls/Info.plist
      properties:
        CFBundleDisplayName: CaptiveAI Steuerelemente
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CaptiveKeychainGroup: "$(AppIdentifierPrefix)com.example.captiveai.shared"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Controls/CaptiveAIControls.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.captiveai
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.example.captiveai.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.captiveai.controls
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  CaptiveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: CaptiveAIApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.captiveai.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CaptiveAI:
    build:
      targets:
        CaptiveAIApp: all
    test:
      targets:
        - CaptiveUITests
