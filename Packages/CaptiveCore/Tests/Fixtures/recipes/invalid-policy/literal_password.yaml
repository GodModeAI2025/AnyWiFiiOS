recipeVersion: 1
profileId: 00000000-0000-0000-0000-000000000004
name: Network Login
network:
  ssid: Corp_Guest
stages:
  - id: login
    match:
      fields: [username, password]
    actions:
      - fill:
          target:
            concept: username
            labelAny: [Username, Benutzername]
            nameAny: [username, user]
          value:
            keychain: corp.username
      - fill:
          target:
            concept: password
            role: passwordField
            nameAny: [password, pass]
          value:
            literal: "SuperSecret123"
      - tap:
          target:
            role: button
            labelAny: [Login, Anmelden]

success:
  internetAccess: true
