<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Network Login</title>
<style>body{font-family:sans-serif;max-width:28rem;margin:2rem auto}label{display:block;margin:.5rem 0}</style>
</head>
<body>
<h1>Network Login</h1>
<form method="post" action="/auth">
  <input type="hidden" name="fixture" value="04_userpass">
  <label for="user">Username</label>
  <input id="user" name="username" autocomplete="username">
  <label for="pw">Password</label>
  <input id="pw" name="password" type="password" autocomplete="current-password">
  <button type="submit" name="action" value="login">Login</button>
</form>
</body>
</html>
