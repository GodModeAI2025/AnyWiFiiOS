name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-linux:
    name: CaptiveCore (swift test, Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: swift build
        working-directory: Packages/CaptiveCore
        run: swift build --build-tests
      - name: swift test
        working-directory: Packages/CaptiveCore
        run: swift test --parallel

  tooling:
    name: Test-Portal & PRL-Schema (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: Fake-Portal-Selbsttests
        run: python -m unittest discover -s tools/test-portal -v
      - name: PRL-Fixtures gegen Schema
        run: python tools/prl/validate_recipes.py
      - name: Schema-Kopie im Paket ist aktuell
        run: cmp Schemas/prl-v1.schema.json Packages/CaptiveCore/Sources/CaptiveCore/Resources/prl-v1.schema.json

  core-macos:
    name: CaptiveCore (swift test, macOS) + Toolchain-Info
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain-Info
        run: |
          sw_vers
          xcodebuild -version
          ls /Applications | grep -i xcode || true
          xcrun --sdk iphonesimulator --show-sdk-version || true
          swift --version
      - name: swift test
        working-directory: Packages/CaptiveCore
        run: swift test --parallel

  app-ios:
    name: App (xcodebuild, iOS Simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen installieren
        run: brew install xcodegen
      - name: Projekt erzeugen
        run: xcodegen generate
      # Die Runner haben (Stand 10/2026) nur das iOS-26-SDK. Die App zielt auf iOS 27 (SPEC §3.6),
      # nutzt aber nur APIs aus iOS 26. Deshalb wird hier mit Deployment-Target 26.0 kompiliert.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project CaptiveAI.xcodeproj -scheme CaptiveAI \
            -destination 'generic/platform=iOS Simulator' \
            IPHONEOS_DEPLOYMENT_TARGET=26.0 CODE_SIGNING_ALLOWED=NO \
            build | tail -n 80

  app-ui-tests:
    name: App UI-Test gegen Testportal (iOS Simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Testportal starten
        run: |
          nohup python3 tools/test-portal/test_portal.py --host 127.0.0.1 --port 8080 --portal 02_terms --log portal.jsonl > portal.out 2>&1 &
          sleep 2
          curl -sS -o /dev/null -w "%{http_code} %{redirect_url}\n" http://127.0.0.1:8080/hotspot-detect.html
      - name: UI-Test
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for rt,devs in sorted(d.items(), reverse=True) if 'iOS' in rt for x in devs if x['name'].startswith('iPhone')))")
          echo "Simulator: $UDID"
          xcodebuild test -project CaptiveAI.xcodeproj -scheme CaptiveAI -destination "id=$UDID" \
            IPHONEOS_DEPLOYMENT_TARGET=26.0 CODE_SIGNING_ALLOWED=NO | tail -n 120
      - name: Portal-Log
        if: always()
        run: cat portal.jsonl || true
