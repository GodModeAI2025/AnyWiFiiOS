name: CI
on:
  push:
  pull_request:

jobs:
  core-linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: swift test (CaptiveCore)
        working-directory: Packages/CaptiveCore
        run: swift test

  app-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install xcodegen
      - name: Projekt erzeugen
        run: xcodegen generate
      - name: Testportal starten
        run: |
          nohup python3 tools/test-portal/server.py --port 8099 > portal.log 2>&1 &
          sleep 1
      - name: Build und UI-Tests (Simulator)
        run: |
          DEST=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+\(([0-9A-F-]+)\)' | grep -oE '[0-9A-F-]{36}')
          xcodebuild -project CaptiveAI.xcodeproj -scheme CaptiveAI \
            -destination "platform=iOS Simulator,id=$DEST" CODE_SIGNING_ALLOWED=NO test
